annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Create ATA chapter task card for turnaround ground line maintenance crew.
input_schema:
  additionalProperties: false
  properties:
    ata_chapter:
      type: string
    component_sn:
      type: string
    fault_description:
      type: string
  required:
  - ata_chapter
  - fault_description
  type: object
name: generate-maintenance-taskcard
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
