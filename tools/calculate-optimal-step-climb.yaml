annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Determine gross weight vs wind gradient to calculate fuel-optimal flight
  level steps.
input_schema:
  additionalProperties: false
  properties:
    cost_index:
      type: number
    gross_weight_kg:
      type: number
    route_waypoints:
      type: string
  required:
  - gross_weight_kg
  - cost_index
  type: object
name: calculate-optimal-step-climb
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
